<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理員登入</title>
  <link rel="stylesheet" href="/team001.css">
</head>
<body>
  <main class="panel">
    <h1>管理員登入</h1>

    <form id="login-form" class="login-form">
      <label for="username">帳號</label>
      <input id="username" class="pill" type="text" autocomplete="username" required>

      <label for="password">密碼</label>
      <input id="password" class="pill" type="password" autocomplete="current-password" required>

      <button type="submit" class="pill">登入</button>
    </form>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
